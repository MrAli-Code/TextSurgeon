name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.8', '3.10', '3.12' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Run Core Engine & CLI Tests
      run: |
        python -m unittest test_surgeon_engine.py test_text_surgeon.py

    - name: Run Autonomous Agent & Skills Tests
      run: |
        python test_surgeon_agent.py

    - name: Run JavaScript Anchor Engine Tests
      run: |
        node test_surgeon_anchor.js
